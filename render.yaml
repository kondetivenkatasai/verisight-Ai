services:
  - type: web
    name: verisight-ai-backend
    env: node
    region: singapore
    buildCommand: npm install
    startCommand: node src/server.js
    rootDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        value: verisight-ai-production-jwt-secret-key-2026
