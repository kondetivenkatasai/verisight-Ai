<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="1"/>
    </radialGradient>

    <!-- Primary Brand Gradient -->
    <linearGradient id="vPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="vSecondaryGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Glowing Iris Core -->
    <radialGradient id="irisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>

  <g transform="translate(0, -10)">
    <!-- Outer Shield Crest / Angular Outline -->
    <path d="M 128 140 C 190 120, 322 120, 384 140 C 384 250, 330 360, 256 424 C 182 360, 128 250, 128 140 Z"
          fill="none" stroke="url(#vSecondaryGrad)" stroke-width="4" stroke-opacity="0.25"/>

    <!-- Left Wing of Geometric V -->
    <path d="M 148 152 L 256 400 L 256 320 L 192 168 Z"
          fill="url(#vPrimaryGrad)" filter="url(#glowFilter)"/>

    <!-- Right Wing of Geometric V -->
    <path d="M 364 152 L 256 400 L 256 320 L 320 168 Z"
          fill="url(#vSecondaryGrad)" filter="url(#glowFilter)"/>

    <!-- Upper Shield Arch / Bridging Top -->
    <path d="M 148 152 Q 256 185 364 152 L 320 168 Q 256 198 192 168 Z"
          fill="url(#vPrimaryGrad)" opacity="0.9"/>

    <!-- Eye Aperture (Vision & Insight Negative Space Contour) -->
    <path d="M 176 220 Q 256 150 336 220 Q 256 290 176 220 Z"
          fill="#0A0A0F" stroke="url(#vPrimaryGrad)" stroke-width="6"/>

    <!-- Eye Pupil / Multi-Agent Core Lens -->
    <circle cx="256" cy="220" r="26" fill="url(#irisGlow)"/>
    <circle cx="256" cy="220" r="12" fill="#FFFFFF"/>

    <!-- Multi-Agent Node Networks (6 Symmetrical Agent Points) -->
    <line x1="256" y1="120" x2="256" y2="168" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4,4"/>
    <line x1="148" y1="152" x2="192" y2="220" stroke="#06B6D4" stroke-width="2.5" stroke-opacity="0.6"/>
    <line x1="364" y1="152" x2="320" y2="220" stroke="#7C3AED" stroke-width="2.5" stroke-opacity="0.6"/>

    <circle cx="256" cy="120" r="6" fill="#38BDF8"/>
    <circle cx="148" cy="152" r="6" fill="#06B6D4"/>
    <circle cx="364" cy="152" r="6" fill="#7C3AED"/>
    <circle cx="192" cy="220" r="5" fill="#3B82F6"/>
    <circle cx="320" cy="220" r="5" fill="#3B82F6"/>
    <circle cx="256" cy="400" r="7" fill="#38BDF8"/>
  </g>
</svg>
